{% extends 'base.html' %}
{% block content %}
<h2>Create your account</h2>
<p class="form-help">Set up a secure profile to build invoices, track revenue, and email clients instantly.</p>
<form method="POST">
    <label>
        <span>Username</span>
        <input type="text" name="username" placeholder="yourname" required>
    </label>
    <label>
        <span>Email</span>
        <input type="email" name="email" placeholder="you@example.com" required>
    </label>
    <label>
        <span>Password</span>
        <input type="password" name="password" placeholder="Create a password" required>
    </label>
    <button type="submit">Register</button>
</form>
<p class="form-help">Already have an account? <a href="{{ url_for('login') }}">Sign in instead.</a></p>
{% endblock %}
