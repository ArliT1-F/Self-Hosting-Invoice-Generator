<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Invoice App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <script>
        (function () {
            try {
                const STORAGE_KEY = 'invoicepro-theme';
                const root = document.documentElement;
                const stored = localStorage.getItem(STORAGE_KEY);
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const initial = stored || (prefersDark ? 'dark' : 'light');
                if (initial === 'dark') {
                    document.body.classList.add('theme-dark');
                }
                root.setAttribute('data-theme', initial);
                root.style.setProperty('color-scheme', initial);
            } catch (error) {
                /* no-op */
            }
        })();
    </script>
    <header class="site-header">
        <div class="container nav-container">
            <a class="brand" href="{{ url_for('landing') }}">InvoicePro</a>
            <nav class="navbar">
                <div class="nav-links">
                    <a href="{{ url_for('landing') }}">Home</a>
                    {% if current_user.is_authenticated %}
                        <a href="{{ url_for('invoices') }}">Invoices</a>
                        <a href="{{ url_for('create_invoice') }}">Create Invoice</a>
                        <a href="{{ url_for('reports') }}">Reports</a>
                        <a class="logout" href="{{ url_for('logout') }}">Logout</a>
                    {% else %}
                        <a href="{{ url_for('login') }}">Login</a>
                        <a class="cta" href="{{ url_for('register') }}">Sign Up</a>
                    {% endif %}
                </div>
                <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Activate dark mode">
                    <span class="theme-toggle__icon" aria-hidden="true">??</span>
                    <span class="theme-toggle__label">Dark mode</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; {{ datetime.utcnow().year }} InvoicePro. All rights reserved.</p>
        </div>
    </footer>
    <script>
        (function () {
            const STORAGE_KEY = 'invoicepro-theme';
            const toggle = document.getElementById('theme-toggle');
            const icon = toggle?.querySelector('.theme-toggle__icon');
            const label = toggle?.querySelector('.theme-toggle__label');
            const root = document.documentElement;

            const storage = {
                get() {
                    try {
                        return localStorage.getItem(STORAGE_KEY);
                    } catch (error) {
                        return null;
                    }
                },
                set(value) {
                    try {
                        localStorage.setItem(STORAGE_KEY, value);
                    } catch (error) {
                        /* no-op */
                    }
                }
            };

            const applyTheme = (mode) => {
                const isDark = mode === 'dark';
                document.body.classList.toggle('theme-dark', isDark);
                root?.setAttribute('data-theme', mode);
                root?.style.setProperty('color-scheme', isDark ? 'dark' : 'light');
                if (toggle && label) {
                    const labelText = isDark ? 'Light mode' : 'Dark mode';
                    label.textContent = labelText;
                    toggle.setAttribute('aria-label', `Activate ${labelText.toLowerCase()}`);
                }
                if (icon) {
                    icon.textContent = isDark ? '??' : '??';
                }
            };

            const getInitialTheme = () => {
                const stored = storage.get();
                if (stored) {
                    return stored;
                }
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    return 'dark';
                }
                return 'light';
            };

            const applyInitialTheme = () => {
                applyTheme(getInitialTheme());
            };

            applyInitialTheme();

            toggle?.addEventListener('click', () => {
                const next = document.body.classList.contains('theme-dark') ? 'light' : 'dark';
                applyTheme(next);
                storage.set(next);
            });

            if (window.matchMedia) {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handleChange = (event) => {
                    if (storage.get()) {
                        return;
                    }
                    applyTheme(event.matches ? 'dark' : 'light');
                };

                if (typeof mediaQuery.addEventListener === 'function') {
                    mediaQuery.addEventListener('change', handleChange);
                } else if (typeof mediaQuery.addListener === 'function') {
                    mediaQuery.addListener(handleChange);
                }
            }
        })();
    </script>
</body>
</html>
