<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Invoice App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header class="site-header">
        <div class="container nav-container">
            <a class="brand" href="{{ url_for('landing') }}">InvoicePro</a>
            <nav class="navbar">
                <a href="{{ url_for('landing') }}">Home</a>
                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('invoices') }}">Invoices</a>
                    <a href="{{ url_for('create_invoice') }}">Create Invoice</a>
                    <a href="{{ url_for('reports') }}">Reports</a>
                    <a class="logout" href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                    <a href="{{ url_for('login') }}">Login</a>
                    <a class="cta" href="{{ url_for('register') }}">Sign Up</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; {{ datetime.utcnow().year }} InvoicePro. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
