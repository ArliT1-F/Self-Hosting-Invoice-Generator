{% extends 'base.html' %}
{% block content %}
<h2>Welcome back</h2>
<p class="form-help">Access your dashboard with the credentials you set during registration.</p>
<form method="POST">
    <label>
        <span>Username</span>
        <input type="text" name="username" placeholder="yourname" required>
    </label>
    <label>
        <span>Password</span>
        <input type="password" name="password" placeholder="????????" required>
    </label>
    <button type="submit">Login</button>
</form>
<p class="form-help">Need an account? <a href="{{ url_for('register') }}">Create one in seconds.</a></p>
{% endblock %}
